[project]
name = "guru-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,elevenlabs,google,openai,silero]~=1.8",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client[fastembed]>=1.19.1",
]

# Installable so backend/ can import guru (chunk, embed, planner, scorer) instead of copying it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guru"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
